<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>窄屏预览 · industrial-revolutions</title>
<style>
  body{margin:0;background:#e8e6e0;font:13px/1.5 'PingFang SC',sans-serif;padding:16px;}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .box{background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  iframe{border:0;display:block;background:#f7f5f0;}

<body>
<p class="tip">
  窄屏布局验收台：把目标页面塞进固定宽度的 iframe，媒体查询在 iframe 内按该宽度生效。
  浏览器工具没有「改视口」的动作，这是唯一可靠的窄屏验收办法。
  改完 <code>visualization/assets/style.css</code> 后刷新本页即可。
  用法：改文件里的 <code>src</code> 指向要看的页面。
</p>
<div class="row">
  <div class="box"><div class="cap">380px（手机）</div>
    <iframe src="../../visualization/06-fourth.html" width="380" height="760"></iframe></div>
  <div class="box"><div class="cap">520px（小窗）</div>
    <iframe src="../../visualization/06-fourth.html" width="520" height="760"></iframe></div>
  <div class="box"><div class="cap">768px（平板）</div>
    <iframe src="../../visualization/06-fourth.html" width="768" height="760"></iframe></div>
</div>
</body>
</html>
